<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nexuslab.in</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem; line-height: 1.5; color: #111; }
  h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
  .subtitle { color: #666; margin-top: 0; margin-bottom: 2.5rem; }
  .subtitle a { color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .card { display: block; border: 1px solid #ddd; border-radius: 10px; padding: 1.1rem 1.25rem; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: #888; transform: translateY(-1px); }
  .card h2 { font-size: 1.05rem; margin: 0 0 0.35rem; }
  .card p { font-size: 0.9rem; color: #666; margin: 0; }
  footer { margin-top: 3rem; font-size: 0.8rem; color: #999; }
  footer a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    body { color: #eee; }
    .card { border-color: #333; }
    .card:hover { border-color: #777; }
    .subtitle, .card p { color: #999; }
    footer { color: #666; }
  }
</style>
</head>
<body>
  <h1>nexuslab.in</h1>
  <p class="subtitle">Projects from <a href="https://github.com/nexus-lab-org">nexus-lab-org</a></p>
  <div class="grid">
    <a class="card" href="https://nexuslab.in/finance-calculator/">
      <h2>finance-calculator</h2>
    </a>
    <a class="card" href="https://nexuslab.in/canopy/">
      <h2>canopy</h2>
      <p>Git worktree wrapper</p>
    </a>
    <a class="card" href="https://nexuslab.in/port-sniffer/">
      <h2>port-sniffer</h2>
      <p>A CLI tool to find open port for a hostname</p>
    </a>
  </div>
  <footer><a href="https://github.com/nexus-lab-org">GitHub org</a></footer>
</body>
</html>
